name: Release

on:
  workflow_dispatch:
    inputs:
      bump-type:
        type: choice
        description: "Select the version bump type"
        required: true
        default: "patch"
        options: ["patch", "minor", "major"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC token for JSR and npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (needed for npm publish and jsr CLI)
        uses: actions/setup-node@v7

      - name: Ensure npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Bump version
        id: version
        run: |
          npm version "${{ inputs.bump-type }}" --no-git-tag-version

          version=$(node -p "require('./package.json').version")
          sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"$version\"/" jsr.json

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.4
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "chore: bump version to v${{ steps.version.outputs.version }}"

      - name: Publish to JSR
        run: bunx jsr publish

      - name: Build npm package
        run: bun run build:npm

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
